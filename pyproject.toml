[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "donde-plata"
version = "0.1.0"
description = "Donde Plata Telegram bot."
requires-python = ">=3.12"
dependencies = ["python-telegram-bot>=22,<23", "starlette>=0.40,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
"donde-plata" = "donde_plata.runtime:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
"donde_plata" = ["static/mini_app/*"]
