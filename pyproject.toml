[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "donde-plata"
version = "0.1.0"
description = "Donde Plata Telegram bot."
requires-python = ">=3.12"
dependencies = ["python-telegram-bot[webhooks]>=22,<23"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
"donde-plata" = "donde_plata.runtime:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
